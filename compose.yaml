services:
  pypi-server:
    build: .
    image: pypi-server:latest
    container_name: pypi-server
    restart: unless-stopped
    env_file: .env
    ports:
      - "${PYPI_PORT:-8010}:8010"
    volumes:
      - packages:/pypi/packages
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

volumes:
  packages:
